<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --brand-blue: #0c4d82;
      --brand-blue-dark: #0b4475;
      --page-bg: #f1f1f1;
      --panel-bg: #f7f7f7;
      --panel-border: #dfe7f0;
      --text: #222f3d;
      --muted: #667688;
      --success: #1ea260;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page-bg);
      color: var(--text);
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }

    .topbar {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, var(--brand-blue) 0%, var(--brand-blue-dark) 100%);
      padding: 0 26px;
      box-shadow: inset 0 -1px 0 rgba(255,255,255,0.08);
    }

    .brand {
      margin: 0;
      color: #ffffff;
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1;
    }

    .menu-button {
      width: 34px;
      height: 34px;
      background: transparent;
      border: none;
      position: relative;
      cursor: pointer;
      padding: 0;
      z-index: 2;
    }

    .menu-button span,
    .menu-button::before,
    .menu-button::after {
      content: "";
      position: absolute;
      left: 5px;
      right: 5px;
      height: 3px;
      border-radius: 3px;
      background: rgba(255,255,255,0.9);
    }

    .menu-button span { top: 15px; }
    .menu-button::before { top: 7px; }
    .menu-button::after { top: 23px; }

    .mobile-menu {
      display: none;
      background: #ffffff;
      border-bottom: 1px solid #d9e2ec;
      box-shadow: 0 6px 20px rgba(17, 38, 60, 0.08);
      padding: 14px 18px;
    }

    .mobile-menu.open {
      display: block;
    }

    .mobile-menu a {
      display: block;
      padding: 10px 8px;
      color: #123b62;
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px solid #edf2f7;
    }

    .mobile-menu a:last-child {
      border-bottom: none;
    }

    main {
      max-width: 980px;
      margin: 26px auto 0;
      padding: 0 18px 30px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1 class="brand">防災アプリ</h1>
    <button id="menuToggle" class="menu-button" aria-label="メニュー" aria-expanded="false"><span></span></button>
  </header>

  <nav id="mobileMenu" class="mobile-menu" aria-label="メニュー">
    <a href="/">ホーム</a>
    <a href="/shelter_search">避難所検索</a>
    <a href="/shelter_register">避難所登録</a>
    <a href="/board">指示・発信ボード</a>
    {% if session.logged_in %}
      <a href="/logout">ログアウト</a>
    {% else %}
      <a href="/login">ログイン</a>
    {% endif %}
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <script>
    const menuToggle = document.getElementById('menuToggle');
    const mobileMenu = document.getElementById('mobileMenu');

    if (menuToggle && mobileMenu) {
      menuToggle.addEventListener('click', function () {
        const isOpen = mobileMenu.classList.toggle('open');
        menuToggle.setAttribute('aria-expanded', String(isOpen));
      });
    }
  </script>
</body>
</html>
