{% extends "base.html" %}

{% block content %}
<style>
  .panel-stack {
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .panel {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    box-shadow: 0 3px 10px rgba(18, 41, 64, 0.05);
    padding: 20px 20px 16px;
  }

  .panel-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 12px;
    color: #0a4a7e;
    font-size: 1.1rem;
    font-weight: 700;
  }

  .pin {
    position: relative;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #0a4a7e;
    box-shadow: inset 0 0 0 3px #fff;
  }

  .pin::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #fff;
    transform: translate(-50%, -50%);
  }

  .map-shell {
    width: 100%;
    height: 430px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #dfe8f3;
    background: #dfeef5;
  }

  #shelterMap {
    width: 100%;
    height: 100%;
  }

  .weather-panel {
    padding: 16px 20px;
  }

  .weather-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid #dde5ee;
  }

  .weather-title {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #0a4a7e;
    font-size: 1.05rem;
    font-weight: 800;
  }

  .weather-icon {
    font-size: 1.5rem;
    line-height: 1;
  }

  .auto-update {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    border: 1px solid rgba(23, 149, 92, 0.2);
    background: rgba(28, 168, 93, 0.08);
    color: var(--success);
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 700;
    white-space: nowrap;
  }

  .weather-body {
    padding-top: 12px;
  }

  .city-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    color: #0a4a7e;
    font-weight: 800;
    font-size: 1rem;
  }

  .city-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #0a4a7e;
    box-shadow: 0 0 0 2px rgba(10,74,126,0.12);
  }

  .notice {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 8px 0 10px;
    color: #1ea260;
    font-weight: 700;
  }

  .notice-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #1ea260;
    color: white;
    font-size: 0.8rem;
  }

  .meta {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #5f6d7d;
    margin-top: 8px;
  }

  .meta-icon {
    font-size: 0.9rem;
    color: #7b8694;
  }

  @media (max-width: 640px) {
    .topbar {
      height: 64px;
      padding: 0 18px;
    }

    .brand {
      font-size: 1.6rem;
    }

    .weather-head {
      flex-direction: column;
      align-items: flex-start;
    }

    .auto-update {
      width: 100%;
      justify-content: center;
    }
  }
</style>

<div class="panel-stack">
  <section class="panel">
    <h2 class="panel-title"><span class="pin"></span>避難所マップ</h2>
    <div class="map-shell">
      <div id="shelterMap"></div>
    </div>
  </section>

  <section class="panel weather-panel">
    <div class="weather-head">
      <div class="weather-title"><span class="weather-icon">☁</span>青森市 気象情報・注意報</div>
      <div class="auto-update">↻ 10分おき自動更新</div>
    </div>

    <div class="weather-body" id="weatherContent">
      <p>読み込み中...</p>
    </div>
  </section>
</div>

<!-- Leaflet の読み込み -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const map = L.map('shelterMap').setView([35.3390, 139.4903], 11.5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                updateWeatherContent(data);
            })
            .catch(() => {
                updateWeatherContent({
                    area_name: '青森市',
                    warnings: [],
                    report_time: '更新中...',
                    last_fetch_time: '更新中...'
                });
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');
        const areaName = data.area_name || '青森市';
        const lastFetch = data.last_fetch_time || '更新中...';
        const reportTime = data.report_time || '不明';

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = '<ul>' + data.warnings.map(warning => {
                return `<li>${warning.name}（${warning.status}）</li>`;
            }).join('') + '</ul>';
        } else {
            warningsHtml = `
                <div class="notice">
                    <span class="notice-badge">✓</span>
                    <span>現在、警報・注意報は発表されていません</span>
                </div>
            `;
        }

        weatherContent.innerHTML = `
            <div class="city-row"><span class="city-dot"></span>${areaName}</div>
            ${warningsHtml}
            <div class="meta"><span class="meta-icon">◔</span>データ取得時刻: ${lastFetch}</div>
            <div class="meta"><span class="meta-icon">◔</span>気象庁発表: ${reportTime}</div>
        `;
    }

    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
